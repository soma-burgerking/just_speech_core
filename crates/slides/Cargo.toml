[package]
name = "slides"
version = "0.1.0"
edition = "2021"
publish = false

# Nothing app-only here: crates/slides-wasm compiles this crate for wasm32-unknown-unknown.
[dependencies]
anyhow = "1.0.100"
cfb = "0.14.0"
lopdf = { version = "0.44.0", default-features = false }
once_cell = "1.19.0"
regex = "1.10.0"
roxmltree = "0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
