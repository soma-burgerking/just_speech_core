[package]
name = "bundle_wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace: the size-tuned release profile below must not reach the app's build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bundle = { path = "../rust" }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
