[package]
name = "bundle"
version = "0.1.0"
edition = "2021"
publish = false

# Nothing app-only here: the render worker reads the same files through wasm.
[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
