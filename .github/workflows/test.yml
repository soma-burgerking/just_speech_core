name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Every crate must keep building for the browser. slides alone does not:
      # lopdf needs the wasm getrandom backend that slides/wasm turns on.
      - run: cargo build -p bundle --target wasm32-unknown-unknown
      - run: cargo build --manifest-path slides/wasm/Cargo.toml --target wasm32-unknown-unknown --release
