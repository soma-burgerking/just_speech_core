name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Every crate must keep building for the browser. slides alone does not:
      # lopdf needs the wasm getrandom backend that slides/wasm turns on.
      - run: cargo build -p bundle --target wasm32-unknown-unknown
      - run: cargo build --manifest-path slides/wasm/Cargo.toml --target wasm32-unknown-unknown --release

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [qa-prompt/dart, script/dart]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.2"
      - run: dart pub get
      - run: dart test

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test '*/ts/*.test.ts'
